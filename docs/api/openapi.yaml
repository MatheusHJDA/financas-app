openapi: 3.1.0
info:
  title: Finanças API
  version: 0.1.0
  description: >-
    Contrato da API do app Finanças (congelado em U0). Dinheiro sempre em centavos (inteiro,
    sufixo `_cents`). Datas em ISO 8601; fuso de apresentação America/Sao_Paulo.
servers:
  - url: /api
security:
  - cookieAuth: []
tags:
  - {name: health}
  - {name: auth}
  - {name: accounts}
  - {name: categories}
  - {name: transactions}
  - {name: overview}
  - {name: bills}
  - {name: debts}
  - {name: goals}
  - {name: ingest}
  - {name: push}
  - {name: plan}
  - {name: reports}
  - {name: admin}

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness (não consulta o banco)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Como a tela de entrada deve funcionar (se a chave de acesso é exigida)
      security: []
      responses:
        "200":
          description: Configuração do login
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthConfig"}
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login com nome digitado e PIN; define o cookie `session`
      description: |
        Nome sem espaços nas pontas e sem diferenciar maiúsculas. Qualquer falha (nome, PIN, conta
        travada) responde 401 com a mesma mensagem. Origem com 5 falhas em 15 min recebe 429 com
        `Retry-After`; conta com 20 falhas em 1 h fica travada até a administração liberar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Autenticado
          headers:
            Set-Cookie:
              description: Cookie `session` (HttpOnly, Secure, SameSite=Strict, Max-Age 30 dias)
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Error"}
        "429":
          description: Muitas tentativas desta origem
          headers:
            Retry-After:
              description: Segundos até poder tentar de novo
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Encerra a sessão atual
      responses:
        "204": {description: Sessão encerrada}
        "401": {$ref: "#/components/responses/Error"}
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário autenticado
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Sessões (aparelhos) do usuário
      responses:
        "200":
          description: Sessões
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Error"}
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Revoga uma sessão
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Revogada}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Lista contas
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Contas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountPage"}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Cria conta
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountCreate"}
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /accounts/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Detalhe da conta
      responses:
        "200":
          description: Conta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Altera conta
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountUpdate"}
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Remove conta (409 se houver lançamentos)
      responses:
        "204": {description: Removida}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Lista categorias
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CategoryPage"}
    post:
      tags: [categories]
      operationId: createCategory
      summary: Cria categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CategoryCreate"}
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Category"}
        "403": {$ref: "#/components/responses/Error"}
  /categories/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Altera categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CategoryUpdate"}
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Category"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Remove categoria (409 se em uso)
      responses:
        "204": {description: Removida}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: Lista lançamentos
      parameters:
        - {$ref: "#/components/parameters/TxOwner"}
        - {$ref: "#/components/parameters/TxAccountId"}
        - {$ref: "#/components/parameters/TxCategoryId"}
        - {$ref: "#/components/parameters/TxKind"}
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Q"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Lançamentos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionPage"}
    post:
      tags: [transactions]
      operationId: createTransaction
      summary: Cria lançamento manual
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionCreate"}
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /transactions/export.csv:
    get:
      tags: [transactions]
      operationId: exportTransactionsCsv
      summary: Exporta lançamentos em CSV (mesmos filtros da listagem)
      parameters:
        - {$ref: "#/components/parameters/TxOwner"}
        - {$ref: "#/components/parameters/TxAccountId"}
        - {$ref: "#/components/parameters/TxCategoryId"}
        - {$ref: "#/components/parameters/TxKind"}
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Q"}
        - {$ref: "#/components/parameters/ExportLimit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: {type: string}
  /transactions/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Detalhe do lançamento
      responses:
        "200":
          description: Lançamento
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [transactions]
      operationId: updateTransaction
      summary: Altera lançamento
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionUpdate"}
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      summary: Remove lançamento
      responses:
        "204": {description: Removido}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Visão geral (saldos, faturas, dívidas, contas a pagar)
      responses:
        "200":
          description: Visão geral
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}

  /recurring-bills:
    get:
      tags: [bills]
      operationId: listRecurringBills
      summary: Lista contas recorrentes
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Contas recorrentes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecurringBillPage"}
    post:
      tags: [bills]
      operationId: createRecurringBill
      summary: Cria conta recorrente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecurringBillCreate"}
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecurringBill"}
        "403": {$ref: "#/components/responses/Error"}
  /recurring-bills/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    patch:
      tags: [bills]
      operationId: updateRecurringBill
      summary: Altera conta recorrente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecurringBillUpdate"}
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecurringBill"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      tags: [bills]
      operationId: deleteRecurringBill
      summary: Remove conta recorrente
      responses:
        "204": {description: Removida}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /bill-instances:
    get:
      tags: [bills]
      operationId: listBillInstances
      summary: Lista instâncias mensais de contas a pagar
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/BillStatus"}
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Instâncias
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillInstancePage"}
  /bill-instances/{id}/pay:
    post:
      tags: [bills]
      operationId: payBillInstance
      summary: Marca como paga (vincula ou cria o lançamento)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BillPayRequest"}
      responses:
        "200":
          description: Paga
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillInstance"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /debts:
    get:
      tags: [debts]
      operationId: listDebts
      summary: Lista dívidas
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Dívidas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebtPage"}
    post:
      tags: [debts]
      operationId: createDebt
      summary: Cria dívida
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DebtCreate"}
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Debt"}
        "403": {$ref: "#/components/responses/Error"}
  /debts/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [debts]
      operationId: getDebt
      summary: Detalhe da dívida
      responses:
        "200":
          description: Dívida
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Debt"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [debts]
      operationId: updateDebt
      summary: Altera dívida (com parcelas, saldo e valor da parcela são derivados e dão 409)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DebtUpdate"}
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Debt"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      tags: [debts]
      operationId: deleteDebt
      summary: Remove dívida
      responses:
        "204": {description: Removida}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /debts/{id}/installments:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [debts]
      operationId: getDebtInstallments
      summary: Resumo do empréstimo e suas parcelas (valor hoje calculado na data de São Paulo)
      responses:
        "200":
          description: Resumo; dívida sem parcelas devolve items vazio e remaining_cents = saldo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoanSummary"}
        "404": {$ref: "#/components/responses/Error"}
  /debts/{id}/installments/pay:
    parameters: [{$ref: "#/components/parameters/Id"}]
    post:
      tags: [debts]
      operationId: payDebtInstallments
      summary: Paga ou adianta parcelas com uma única despesa no valor cobrado
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PayInstallments"}
      responses:
        "200":
          description: Resumo atualizado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoanSummary"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /goals:
    get:
      tags: [goals]
      operationId: listGoals
      summary: Lista metas com progresso
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Metas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GoalPage"}
    post:
      tags: [goals]
      operationId: createGoal
      summary: Cria meta
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GoalCreate"}
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Goal"}
        "403": {$ref: "#/components/responses/Error"}
  /goals/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [goals]
      operationId: getGoal
      summary: Detalhe da meta com progresso
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Goal"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [goals]
      operationId: updateGoal
      summary: Altera meta
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GoalUpdate"}
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Goal"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [goals]
      operationId: deleteGoal
      summary: Remove meta
      responses:
        "204": {description: Removida}
        "404": {$ref: "#/components/responses/Error"}
  /goals/{id}/entries:
    post:
      tags: [goals]
      operationId: createGoalEntry
      summary: Registra aporte na meta
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GoalEntryCreate"}
      responses:
        "201":
          description: Aporte registrado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GoalEntry"}
        "404": {$ref: "#/components/responses/Error"}

  /ingest:
    post:
      tags: [ingest]
      operationId: ingest
      summary: Envia texto e/ou arquivo (até 10 MB) para extração por IA; gera rascunhos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: {type: string}
                file: {type: string, format: binary, description: "Até 10 MB"}
      responses:
        "200":
          description: Rascunhos extraídos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IngestResult"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/AiUnavailable"}
  /ingest/{extraction_id}:
    get:
      tags: [ingest]
      operationId: getIngest
      summary: Resultado de uma extração
      parameters:
        - name: extraction_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Extração
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IngestResult"}
        "404": {$ref: "#/components/responses/Error"}
  /drafts/{id}/confirm:
    post:
      tags: [ingest]
      operationId: confirmDraft
      summary: Confirma o rascunho (opcionalmente editado) e cria o lançamento
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProposedTransaction"}
      responses:
        "200":
          description: Lançamento criado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /drafts/{id}/discard:
    post:
      tags: [ingest]
      operationId: discardDraft
      summary: Descarta o rascunho
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Descartado}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /drafts/confirm-batch:
    post:
      tags: [ingest]
      operationId: confirmDraftsBatch
      summary: Confirma vários rascunhos de uma vez
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_ids]
              properties:
                draft_ids:
                  type: array
                  items: {type: integer, format: int64}
      responses:
        "200":
          description: Lançamentos criados
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Transaction"}
        "409": {$ref: "#/components/responses/Error"}
  /attachments/{id}:
    get:
      tags: [ingest]
      operationId: getAttachment
      summary: Baixa o anexo (binário)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: Arquivo
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/Error"}

  /push/vapid-public-key:
    get:
      tags: [push]
      operationId: getVapidPublicKey
      summary: Chave pública VAPID
      responses:
        "200":
          description: Chave
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: {type: string}
  /push/subscriptions:
    get:
      tags: [push]
      operationId: listPushSubscriptions
      summary: Inscrições de push do usuário
      responses:
        "200":
          description: Inscrições
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PushSubscription"}
    post:
      tags: [push]
      operationId: createPushSubscription
      summary: Registra inscrição de push deste aparelho
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushSubscriptionCreate"}
      responses:
        "201":
          description: Registrada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSubscription"}
  /push/subscriptions/{id}:
    delete:
      tags: [push]
      operationId: deletePushSubscription
      summary: Remove inscrição de push
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Removida}
        "404": {$ref: "#/components/responses/Error"}

  /plan/assumptions:
    get:
      tags: [plan]
      operationId: getPlanAssumptions
      summary: Premissas do plano
      responses:
        "200":
          description: Premissas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanAssumptions"}
    put:
      tags: [plan]
      operationId: putPlanAssumptions
      summary: Substitui as premissas do plano
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanAssumptions"}
      responses:
        "200":
          description: Premissas salvas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanAssumptions"}
        "403": {$ref: "#/components/responses/Error"}
  /plan/projection:
    get:
      tags: [plan]
      operationId: getPlanProjection
      summary: Projeção mensal do plano
      parameters:
        - name: scenario
          in: query
          required: true
          schema: {type: string, enum: [amortize_now, no_amortization]}
      responses:
        "200":
          description: Projeção
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanProjection"}

  /reports/month:
    get:
      tags: [reports]
      operationId: getMonthReport
      summary: Relatório do mês (totais, contas fixas, categorias, ritmo de gasto)
      description: |
        Agrega lançamentos e contas fixas de um mês, em centavos. Mesmas regras de leitura de
        `GET /transactions` (só agrega o que o usuário já pode listar). Transferências não contam.
        Datas no fuso America/Sao_Paulo.
      parameters:
        - name: month
          in: query
          required: true
          description: Mês no formato AAAA-MM.
          schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
        - name: owner
          in: query
          description: Sem `owner`, soma todos (visão do casal).
          schema: {$ref: "#/components/schemas/Owner"}
      responses:
        "200":
          description: Relatório do mês
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MonthReport"}
        "422": {$ref: "#/components/responses/Error"}

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: Usuários (somente admin)
      responses:
        "200":
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdminUser"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/reset-pin:
    post:
      tags: [admin]
      operationId: adminResetPin
      summary: Redefine o PIN de um usuário
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                new_pin: {type: string, minLength: 4, maxLength: 12}
      responses:
        "204": {description: PIN redefinido}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/users/{id}/sessions:
    delete:
      tags: [admin]
      operationId: adminRevokeUserSessions
      summary: Revoga todas as sessões de um usuário
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Sessões revogadas}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      summary: Configurações (horários, antecedência, modelo de IA, reserva mínima...)
      responses:
        "200":
          description: Configurações
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppSettings"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [admin]
      operationId: adminPutSettings
      summary: Substitui as configurações
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppSettings"}
      responses:
        "200":
          description: Configurações salvas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppSettings"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/notifications/test:
    post:
      tags: [admin]
      operationId: adminTestNotification
      summary: Envia notificação de teste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: integer, format: int64}
      responses:
        "200":
          description: Resultado do envio
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: {type: integer}
        "403": {$ref: "#/components/responses/Error"}
  /admin/push-subscriptions:
    get:
      tags: [admin]
      operationId: adminListPushSubscriptions
      summary: Todas as inscrições de push
      responses:
        "200":
          description: Inscrições
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PushSubscription"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ai/calls:
    get:
      tags: [admin]
      operationId: adminListAiCalls
      summary: Chamadas de IA (custo e tokens)
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Chamadas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiCallPage"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      summary: Log de auditoria
      parameters:
        - name: entity
          in: query
          schema: {type: string}
        - name: user_id
          in: query
          schema: {type: integer, format: int64}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Eventos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditPage"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/system:
    get:
      tags: [admin]
      operationId: adminSystem
      summary: Saúde do sistema (banco, agendador, último backup)
      responses:
        "200":
          description: Estado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemStatus"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/backups/latest:
    get:
      tags: [admin]
      operationId: adminDownloadLatestBackup
      summary: Baixa o backup mais recente
      responses:
        "200":
          description: Arquivo de backup
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ExportLimit:
      name: limit
      in: query
      description: Sem `limit`, exporta tudo o que casa com os filtros.
      schema: {type: integer, minimum: 1, maximum: 200}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    TxOwner:
      name: owner
      in: query
      schema: {$ref: "#/components/schemas/Owner"}
    TxAccountId:
      name: account_id
      in: query
      schema: {type: integer, format: int64}
    TxCategoryId:
      name: category_id
      in: query
      schema: {type: integer, format: int64}
    TxKind:
      name: kind
      in: query
      schema: {$ref: "#/components/schemas/TxKind"}
    DateFrom:
      name: date_from
      in: query
      schema: {type: string, format: date}
    DateTo:
      name: date_to
      in: query
      schema: {type: string, format: date}
    Q:
      name: q
      in: query
      description: Busca textual na descrição
      schema: {type: string}
  responses:
    Error:
      description: Erro padrão
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    AiUnavailable:
      description: IA indisponível ou limite atingido
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AiError"}
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    AiError:
      type: object
      required: [detail, code]
      properties:
        detail: {type: string}
        code: {type: string, enum: [ai_limit_reached, ai_unavailable]}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Owner:
      type: string
      enum: [RUTH, MATHEUS, AMBOS]
    Role:
      type: string
      enum: [admin, member]
    AccountType:
      type: string
      enum: [checking, savings, cash, meal_voucher, credit_card, loan]
    CategoryKind:
      type: string
      enum: [income, expense]
    TxKind:
      type: string
      enum: [income, expense, transfer]
    TxSource:
      type: string
      enum: [chat, manual, import]
    DraftStatus:
      type: string
      enum: [pending, confirmed, discarded]
    BillStatus:
      type: string
      enum: [open, paid, prepaid]
      description: prepaid = parcela de empréstimo adiantada (paga antes do mês do vencimento)
    AuthConfig:
      type: object
      required: [passkey_required]
      properties:
        passkey_required: {type: boolean}
    LoginRequest:
      type: object
      required: [name, pin, device_label]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        pin: {type: string}
        device_label: {type: string}
    Me:
      type: object
      required: [id, name, role, owner]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        owner: {$ref: "#/components/schemas/Owner"}
    Session:
      type: object
      required: [id, device_label, created_at, expires_at, current]
      properties:
        id: {type: integer, format: int64}
        device_label: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        current: {type: boolean}

    Account:
      type: object
      required: [id, owner, created_by, name, type, initial_balance_cents, initial_balance_date, active, current_balance_cents]
      properties:
        id: {type: integer, format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
        created_by: {type: integer, format: int64}
        name: {type: string}
        type: {$ref: "#/components/schemas/AccountType"}
        institution: {type: [string, "null"]}
        last4: {type: [string, "null"], maxLength: 4}
        initial_balance_cents: {type: integer, format: int64}
        initial_balance_date: {type: string, format: date}
        closing_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        due_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        active: {type: boolean}
        current_balance_cents:
          type: integer
          format: int64
          readOnly: true
          description: initial_balance_cents + lançamentos confirmados desde initial_balance_date
    AccountCreate:
      type: object
      required: [owner, name, type, initial_balance_cents, initial_balance_date]
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        type: {$ref: "#/components/schemas/AccountType"}
        institution: {type: [string, "null"]}
        last4: {type: [string, "null"], maxLength: 4}
        initial_balance_cents: {type: integer, format: int64}
        initial_balance_date: {type: string, format: date}
        closing_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        due_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        active: {type: boolean, default: true}
    AccountUpdate:
      type: object
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        type: {$ref: "#/components/schemas/AccountType"}
        institution: {type: [string, "null"]}
        last4: {type: [string, "null"], maxLength: 4}
        initial_balance_cents: {type: integer, format: int64}
        initial_balance_date: {type: string, format: date}
        closing_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        due_day: {type: [integer, "null"], minimum: 1, maximum: 31}
        active: {type: boolean}
    AccountPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Account"}
        total: {type: integer}

    Category:
      type: object
      required: [id, name, kind, is_recurring_card_allowed]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        parent_id: {type: [integer, "null"], format: int64}
        is_recurring_card_allowed: {type: boolean}
    CategoryCreate:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        parent_id: {type: [integer, "null"], format: int64}
        is_recurring_card_allowed: {type: boolean, default: false}
    CategoryUpdate:
      type: object
      properties:
        name: {type: string}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        parent_id: {type: [integer, "null"], format: int64}
        is_recurring_card_allowed: {type: boolean}
    CategoryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Category"}
        total: {type: integer}

    Transaction:
      type: object
      required: [id, kind, amount_cents, date, description, account_id, owner, created_by, status, source]
      properties:
        id: {type: integer, format: int64}
        kind: {$ref: "#/components/schemas/TxKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        date: {type: string, format: date}
        description: {type: string}
        account_id: {type: integer, format: int64}
        to_account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
        created_by: {type: integer, format: int64}
        status: {type: string, enum: [confirmed]}
        source: {$ref: "#/components/schemas/TxSource"}
        attachment_id: {type: [integer, "null"], format: int64}
        ai_extraction_id: {type: [integer, "null"], format: int64}
        bill_instance_id: {type: [integer, "null"], format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TransactionCreate:
      type: object
      required: [kind, amount_cents, date, description, account_id, owner]
      properties:
        kind: {$ref: "#/components/schemas/TxKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        date: {type: string, format: date}
        description: {type: string}
        account_id: {type: integer, format: int64}
        to_account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
    TransactionUpdate:
      type: object
      properties:
        kind: {$ref: "#/components/schemas/TxKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        date: {type: string, format: date}
        description: {type: string}
        account_id: {type: integer, format: int64}
        to_account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
    TransactionPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Transaction"}
        total: {type: integer}

    OwnerBalances:
      type: object
      required: [owner, accounts, total_cents]
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        accounts:
          type: array
          items: {$ref: "#/components/schemas/Account"}
        total_cents: {type: integer, format: int64}
    CardInvoice:
      type: object
      required: [account_id, account_name, open_amount_cents]
      properties:
        account_id: {type: integer, format: int64}
        account_name: {type: string}
        open_amount_cents: {type: integer, format: int64}
        due_date: {type: [string, "null"], format: date}
    Overview:
      type: object
      required: [balances_by_owner, couple_total_cents, open_card_invoices, debts_balance_cents, upcoming_bills, overdue_bills]
      properties:
        balances_by_owner:
          type: array
          items: {$ref: "#/components/schemas/OwnerBalances"}
        couple_total_cents: {type: integer, format: int64}
        open_card_invoices:
          type: array
          items: {$ref: "#/components/schemas/CardInvoice"}
        debts_balance_cents: {type: integer, format: int64}
        upcoming_bills:
          description: Contas a pagar dos próximos 15 dias
          type: array
          items: {$ref: "#/components/schemas/BillInstance"}
        overdue_bills:
          type: array
          items: {$ref: "#/components/schemas/BillInstance"}

    MonthReport:
      type: object
      required: [month, income_cents, expense_cents, balance_cents, bills, previous, expense_delta_cents, by_category, daily_cumulative_expense]
      properties:
        month: {type: string, format: date, description: Primeiro dia do mês}
        income_cents: {type: integer, format: int64, description: "Soma das receitas do mês."}
        expense_cents: {type: integer, format: int64, description: "Soma das despesas do mês."}
        balance_cents: {type: integer, format: int64, description: "income_cents − expense_cents."}
        bills: {$ref: "#/components/schemas/MonthBills"}
        previous: {$ref: "#/components/schemas/MonthTotals"}
        expense_delta_cents: {type: integer, format: int64, description: "expense_cents − previous.expense_cents."}
        by_category:
          description: Despesas por categoria, da maior para a menor. Sem categoria = category_id null, nome "Sem categoria".
          type: array
          items: {$ref: "#/components/schemas/CategoryShare"}
        daily_cumulative_expense: {$ref: "#/components/schemas/DailyCumulative"}
    MonthTotals:
      type: object
      required: [income_cents, expense_cents]
      properties:
        income_cents: {type: integer, format: int64}
        expense_cents: {type: integer, format: int64}
    MonthBills:
      type: object
      description: Contas fixas (bill_instances) com vencimento no mês.
      required: [total_count, paid_count, paid_cents, open_count, open_cents]
      properties:
        total_count: {type: integer}
        paid_count: {type: integer}
        paid_cents: {type: integer, format: int64}
        open_count: {type: integer}
        open_cents: {type: integer, format: int64}
    CategoryShare:
      type: object
      required: [category_id, name, total_cents, share_bp]
      properties:
        category_id: {type: [integer, "null"], format: int64}
        name: {type: string}
        total_cents: {type: integer, format: int64}
        share_bp: {type: integer, description: "Participação em pontos-base (1% = 100), meio-para-cima; a soma pode não dar 10000."}
    DailyCumulative:
      type: object
      description: |
        Despesa acumulada dia a dia. `current`: mês pedido, até hoje se for o mês corrente
        (fuso de SP), completo se passado, vazio se futuro. `previous`: mês anterior completo.
        Dia sem gasto repete o acumulado.
      required: [current, previous]
      properties:
        current:
          type: array
          items: {$ref: "#/components/schemas/DailyPoint"}
        previous:
          type: array
          items: {$ref: "#/components/schemas/DailyPoint"}
    DailyPoint:
      type: object
      required: [day, cents]
      properties:
        day: {type: integer, minimum: 1, maximum: 31}
        cents: {type: integer, format: int64}
    RecurringBill:
      type: object
      required: [id, owner, name, amount_cents, due_day, start_month]
      properties:
        id: {type: integer, format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        amount_cents: {type: integer, format: int64}
        due_day: {type: integer, minimum: 1, maximum: 31}
        start_month: {type: string, format: date, description: Primeiro dia do mês}
        end_month: {type: [string, "null"], format: date}
        account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        payment_method: {type: [string, "null"]}
        debt_id:
          type: [integer, "null"]
          format: int64
          description: Empréstimo que gere esta conta (só leitura; alterar ou excluir dá 409)
    RecurringBillCreate:
      type: object
      required: [owner, name, amount_cents, due_day, start_month]
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        amount_cents: {type: integer, format: int64}
        due_day: {type: integer, minimum: 1, maximum: 31}
        start_month: {type: string, format: date}
        end_month: {type: [string, "null"], format: date}
        account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        payment_method: {type: [string, "null"]}
    RecurringBillUpdate:
      type: object
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        amount_cents: {type: integer, format: int64}
        due_day: {type: integer, minimum: 1, maximum: 31}
        start_month: {type: string, format: date}
        end_month: {type: [string, "null"], format: date}
        account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        payment_method: {type: [string, "null"]}
    RecurringBillPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RecurringBill"}
        total: {type: integer}
    BillInstance:
      type: object
      required: [id, recurring_bill_id, month, due_date, amount_cents, status]
      properties:
        id: {type: integer, format: int64}
        recurring_bill_id: {type: integer, format: int64}
        name: {type: string, description: Nome da conta recorrente (somente leitura)}
        owner: {$ref: "#/components/schemas/Owner"}
        month: {type: string, format: date}
        due_date: {type: string, format: date}
        amount_cents: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/BillStatus"}
        paid_transaction_id: {type: [integer, "null"], format: int64}
        debt_id: {type: [integer, "null"], format: int64, description: Empréstimo dono da conta}
    BillInstancePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/BillInstance"}
        total: {type: integer}
    BillPayRequest:
      type: object
      properties:
        transaction_id:
          type: [integer, "null"]
          format: int64
          description: Lançamento existente a vincular; se omitido, um lançamento é criado
        amount_cents:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Parcela de empréstimo, valor realmente cobrado (obrigatório sem transaction_id)
        account_id:
          type: [integer, "null"]
          format: int64
          description: Parcela de empréstimo, conta de onde saiu o dinheiro (obrigatório sem transaction_id)
        date:
          type: [string, "null"]
          format: date
          description: Parcela de empréstimo, data do pagamento (padrão hoje)

    Debt:
      type: object
      required: [id, owner, name, principal_cents, monthly_rate, installments, installment_cents, start_date, current_balance_cents, paid_before_app_cents, has_installments]
      properties:
        id: {type: integer, format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        principal_cents: {type: integer, format: int64}
        monthly_rate:
          type: string
          description: Taxa mensal (fração decimal, Numeric(8,6)) como string
        installments: {type: integer}
        installment_cents: {type: integer, format: int64}
        start_date: {type: string, format: date}
        current_balance_cents: {type: integer, format: int64}
        paid_before_app_cents: {type: integer, format: int64, description: Total pago antes de usar o app}
        has_installments: {type: boolean, description: Há parcelas cadastradas (saldo derivado delas)}
    DebtCreate:
      type: object
      required: [owner, name, principal_cents, monthly_rate, installments, installment_cents, start_date, current_balance_cents]
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        principal_cents: {type: integer, format: int64}
        monthly_rate: {type: string}
        installments: {type: integer}
        installment_cents: {type: integer, format: int64}
        start_date: {type: string, format: date}
        current_balance_cents: {type: integer, format: int64}
    DebtUpdate:
      type: object
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        name: {type: string}
        principal_cents: {type: integer, format: int64}
        monthly_rate: {type: string}
        installments: {type: integer}
        installment_cents: {type: integer, format: int64}
        start_date: {type: string, format: date}
        current_balance_cents: {type: integer, format: int64}
    DebtPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Debt"}
        total: {type: integer}
    InstallmentStatus:
      type: string
      enum: [open, paid, prepaid]
    Installment:
      type: object
      required: [id, number, due_date, face_cents, today_cents, savings_cents, status, paid_cents, paid_on, bill_instance_id]
      properties:
        id: {type: integer, format: int64}
        number: {type: integer}
        due_date: {type: string, format: date}
        face_cents: {type: integer, format: int64, description: Valor cheio da parcela}
        today_cents:
          type: [integer, "null"]
          format: int64
          description: Valor para quitar hoje (nulo se já paga ou adiantada)
        savings_cents:
          type: [integer, "null"]
          format: int64
          description: Cheio menos hoje (nulo se já paga ou adiantada)
        status: {$ref: "#/components/schemas/InstallmentStatus"}
        paid_cents: {type: [integer, "null"], format: int64}
        paid_on: {type: [string, "null"], format: date}
        bill_instance_id: {type: integer, format: int64}
    LoanSummary:
      type: object
      required: [remaining_cents, paid_cents, payoff_today_cents, items]
      properties:
        remaining_cents: {type: integer, format: int64, description: Soma do valor cheio das abertas}
        paid_cents: {type: integer, format: int64, description: Pago antes do app mais pago no app}
        payoff_today_cents: {type: integer, format: int64, description: Quitar tudo hoje}
        items:
          type: array
          items: {$ref: "#/components/schemas/Installment"}
    PayInstallments:
      type: object
      required: [installment_ids, amount_cents, account_id, date]
      properties:
        installment_ids:
          type: array
          minItems: 1
          items: {type: integer, format: int64}
        amount_cents: {type: integer, format: int64, minimum: 1}
        account_id: {type: integer, format: int64}
        date: {type: string, format: date}

    GoalLevel:
      type: object
      required: [name, target_cents]
