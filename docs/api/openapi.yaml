        target_cents: {type: integer, format: int64}
    GoalProgress:
      type: object
      required: [current_cents, target_cents, percent]
      properties:
        current_cents: {type: integer, format: int64}
        target_cents: {type: integer, format: int64}
        percent: {type: number}
        level:
          type: [string, "null"]
          description: Nível atingido (metas com níveis)
    Goal:
      type: object
      required: [id, owner, type, name, target_cents, active, progress]
      properties:
        id: {type: integer, format: int64}
        owner: {$ref: "#/components/schemas/Owner"}
        type: {type: string}
        name: {type: string}
        target_cents: {type: integer, format: int64}
        period: {type: [string, "null"]}
        levels: {type: [array, "null"], items: {$ref: "#/components/schemas/GoalLevel"}}
        due_date: {type: [string, "null"], format: date}
        linked_account_id: {type: [integer, "null"], format: int64}
        linked_category_id: {type: [integer, "null"], format: int64}
        active: {type: boolean}
        progress: {$ref: "#/components/schemas/GoalProgress"}
    GoalCreate:
      type: object
      required: [owner, type, name, target_cents]
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        type: {type: string}
        name: {type: string}
        target_cents: {type: integer, format: int64}
        period: {type: [string, "null"]}
        levels: {type: [array, "null"], items: {$ref: "#/components/schemas/GoalLevel"}}
        due_date: {type: [string, "null"], format: date}
        linked_account_id: {type: [integer, "null"], format: int64}
        linked_category_id: {type: [integer, "null"], format: int64}
        active: {type: boolean, default: true}
    GoalUpdate:
      type: object
      properties:
        owner: {$ref: "#/components/schemas/Owner"}
        type: {type: string}
        name: {type: string}
        target_cents: {type: integer, format: int64}
        period: {type: [string, "null"]}
        levels: {type: [array, "null"], items: {$ref: "#/components/schemas/GoalLevel"}}
        due_date: {type: [string, "null"], format: date}
        linked_account_id: {type: [integer, "null"], format: int64}
        linked_category_id: {type: [integer, "null"], format: int64}
        active: {type: boolean}
    GoalPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Goal"}
        total: {type: integer}
    GoalEntryCreate:
      type: object
      required: [amount_cents, date]
      properties:
        amount_cents: {type: integer, format: int64}
        date: {type: string, format: date}
        transaction_id: {type: [integer, "null"], format: int64}
    GoalEntry:
      type: object
      required: [id, goal_id, amount_cents, date]
      properties:
        id: {type: integer, format: int64}
        goal_id: {type: integer, format: int64}
        amount_cents: {type: integer, format: int64}
        date: {type: string, format: date}
        transaction_id: {type: [integer, "null"], format: int64}

    ProposedTransaction:
      type: object
      required: [kind, amount_cents, date, description]
      properties:
        kind: {$ref: "#/components/schemas/TxKind"}
        amount_cents: {type: integer, format: int64, minimum: 1}
        date: {type: string, format: date}
        description: {type: string}
        account_id: {type: [integer, "null"], format: int64}
        to_account_id: {type: [integer, "null"], format: int64}
        category_id: {type: [integer, "null"], format: int64}
        owner: {anyOf: [{$ref: "#/components/schemas/Owner"}, {type: "null"}]}
    Draft:
      type: object
      required: [id, status, payload, confidence, low_confidence_fields]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/DraftStatus"}
        payload: {$ref: "#/components/schemas/ProposedTransaction"}
        confidence: {type: number, minimum: 0, maximum: 1}
        low_confidence_fields:
          type: array
          items: {type: string}
        duplicate_of_transaction_id: {type: [integer, "null"], format: int64}
        plan_rule_warning: {type: [string, "null"]}
        suggested_bill_instance_id: {type: [integer, "null"], format: int64}
    IngestResult:
      type: object
      required: [extraction_id, document_type, warnings, drafts]
      properties:
        extraction_id: {type: integer, format: int64}
        document_type: {type: string}
        warnings:
          type: array
          items: {type: string}
        drafts:
          type: array
          items: {$ref: "#/components/schemas/Draft"}

    PushSubscriptionCreate:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: {type: string}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
        device_label: {type: [string, "null"]}
    PushSubscription:
      type: object
      required: [id, user_id, endpoint, created_at]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        endpoint: {type: string}
        device_label: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        last_ok_at: {type: [string, "null"], format: date-time}

    PlanAssumptions:
      type: object
      description: >-
        Premissas da aba Projeção da planilha v2 (seção 6.7). Valores em centavos; taxa como texto decimal.
        Os padrões são os da planilha e reproduzem o teste de referência.
      required: [start_month, months, salary_cents, other_income_cents, uber_monthly_cents, uber_fuel_percent,
        fixed_bills_cents, daily_expenses_cents, contingency_cents, health_plan_cents, card_installments,
        loan_principal_cents, loan_monthly_rate, loan_installments, loan_balance_cents, initial_amortization_cents,
        cash_now_cents, upfront_payments_cents, reserve_minimum_cents]
      properties:
        start_month: {type: string, format: date, description: "Primeiro mês da projeção (dia 1)."}
        months: {type: integer, minimum: 1, maximum: 60}
        salary_cents: {type: integer, format: int64, minimum: 0, description: "Salário líquido (Ruth)."}
        other_income_cents: {type: integer, format: int64, minimum: 0, description: "Outras receitas fixas (IPTV líquido)."}
        uber_monthly_cents: {type: integer, format: int64, minimum: 0, description: "Uber/99 bruto esperado no mês."}
        uber_fuel_percent: {type: integer, minimum: 0, maximum: 100, description: "% do Uber gasto com combustível."}
        fixed_bills_cents: {type: integer, format: int64, minimum: 0, description: "Total das contas fixas mensais."}
        daily_expenses_cents: {type: integer, format: int64, minimum: 0, description: "Dia a dia (mercado, combustível pessoal, farmácia)."}
        contingency_cents: {type: integer, format: int64, minimum: 0, description: "Imprevistos / Pix diversos."}
        health_plan_cents: {type: integer, format: int64, minimum: 0, description: "Plano de saúde; entra no mês seguinte à quitação."}
        card_installments:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PlanCardInstallment"}
        loan_principal_cents: {type: integer, format: int64, minimum: 0, description: "Valor contratado (base da parcela Price)."}
        loan_monthly_rate: {type: string, description: "Juros ao mês, decimal (ex.: \"0.0345\")."}
        loan_installments: {type: integer, minimum: 1, maximum: 360}
        loan_balance_cents: {type: integer, format: int64, minimum: 0, description: "Saldo devedor antes da amortização inicial."}
        initial_amortization_cents: {type: integer, format: int64, minimum: 0, description: "Amortização feita já no início (reduz prazo)."}
        cash_now_cents: {type: integer, format: int64, description: "Saldo em conta hoje."}
        upfront_payments_cents: {type: integer, format: int64, minimum: 0, description: "Outras saídas imediatas (ex.: fatura já fechada)."}
        reserve_minimum_cents: {type: integer, format: int64, minimum: 0, description: "Nunca amortizar abaixo disso."}
    PlanCardInstallment:
      type: object
      required: [name, installment_cents, count, first_month]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        installment_cents: {type: integer, format: int64, minimum: 0}
        count: {type: integer, minimum: 1, maximum: 120, description: "Parcelas restantes."}
        first_month: {type: integer, minimum: 1, description: "Índice do mês da primeira parcela (1 = start_month)."}
    PlanMonth:
      type: object
      required: [month, income_cents, expense_cents, loan_payment_cents, interest_cents, amortization_cents, debt_balance_cents, reserve_cents]
      properties:
        month: {type: string, format: date}
        income_cents: {type: integer, format: int64, description: "Total de entradas."}
        expense_cents: {type: integer, format: int64, description: "Total de saídas, inclusive a parcela do empréstimo."}
        loan_payment_cents: {type: integer, format: int64}
        interest_cents: {type: integer, format: int64}
        amortization_cents: {type: integer, format: int64, description: "Amortização extra do mês (excedente acima da reserva)."}
        debt_balance_cents: {type: integer, format: int64, description: "Saldo devedor no fim do mês."}
        reserve_cents: {type: integer, format: int64, description: "Caixa no fim do mês."}
    PlanProjection:
      type: object
      required: [scenario, months, payoff_month, total_interest_cents, interest_without_amortization_cents, interest_saved_cents, waiting_cost_per_month_cents]
      properties:
        scenario: {type: string, enum: [amortize_now, no_amortization]}
        months:
          type: array
          items: {$ref: "#/components/schemas/PlanMonth"}
        payoff_month: {type: [string, "null"], format: date, description: "Mês em que o saldo devedor zera; null se não zera no período."}
        total_interest_cents: {type: integer, format: int64, description: "Juros pagos no período projetado."}
        interest_without_amortization_cents: {type: integer, format: int64, description: "Juros pagando todas as parcelas sem amortizar (parcela × nº de parcelas − valor contratado)."}
        interest_saved_cents: {type: integer, format: int64}
        waiting_cost_per_month_cents: {type: integer, format: int64, description: "Juros de cada mês que a amortização inicial espera (valor × taxa)."}

    AdminUser:
      type: object
      required: [id, name, role, failed_attempts]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        failed_attempts: {type: integer}
        locked_until: {type: [string, "null"], format: date-time}
    AppSettings:
      type: object
      description: Mapa chave -> valor JSON (horários, antecedência, modelo de IA, reserva mínima...)
      additionalProperties: true
    AiCall:
      type: object
      required: [id, user_id, model, status, created_at]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        input_kind: {type: string}
        model: {type: string}
        prompt_version: {type: string}
        usage_tokens: {type: [integer, "null"]}
        est_cost_cents: {type: [integer, "null"], format: int64}
        status: {type: string}
        error_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    AiCallPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AiCall"}
        total: {type: integer}
    AuditEvent:
      type: object
      required: [id, entity, entity_id, action, at]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: [integer, "null"], format: int64}
        entity: {type: string}
        entity_id: {type: string}
        action: {type: string}
        before: {type: [object, "null"], additionalProperties: true}
        after: {type: [object, "null"], additionalProperties: true}
        at: {type: string, format: date-time}
    AuditPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        total: {type: integer}
    SystemStatus:
      type: object
      required: [database_ok, scheduler_ok]
      properties:
        database_ok: {type: boolean}
        scheduler_ok: {type: boolean}
        last_backup_at: {type: [string, "null"], format: date-time}
        last_backup_size_bytes: {type: [integer, "null"], format: int64}
