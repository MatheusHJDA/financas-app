# Carga inicial (ORQUESTRACAO.md, seção 11). Valores em centavos inteiros.
# NÃO cria usuários nem contas bancárias (D5): cada um cadastra na interface.
# Idempotente: o loader (`python -m finance_api.seed`) pula o que já existe (por nome).
#
# PENDENTE DE CONFIRMAÇÃO COM O MATHEUS (a seção 11 não traz estes dados):
#  - due_day de cada conta fixa está como 10 (PLACEHOLDER). Ajustar pela interface/admin.
#  - start_date do empréstimo e as parcelas dos cartões Santander/Sicredi (ver notas abaixo).

categories:
  # Receitas
  - {name: Salário, kind: income}
  - {name: Uber/99, kind: income}
  - {name: IPTV, kind: income}
  - {name: Vale-alimentação, kind: income}
  # Despesas. is_recurring_card_allowed marca as categorias das contas "Cartão (recorrente permitido)":
  # Carro (Seguro Loovi), Saúde (Academia, Cartão de Todos), Assinaturas (Assinaturas, Hostinger).
  - {name: Moradia, kind: expense}
  - {name: Carro, kind: expense, is_recurring_card_allowed: true}
  - {name: Combustível, kind: expense}
  - {name: Mercado, kind: expense}
  - {name: Farmácia, kind: expense}
  - {name: Alimentação fora, kind: expense}
  - {name: Contas da casa, kind: expense}
  - {name: Assinaturas, kind: expense, is_recurring_card_allowed: true}
  - {name: Saúde, kind: expense, is_recurring_card_allowed: true}
  - {name: Igreja, kind: expense}
  - {name: MEI/Impostos, kind: expense}
  - {name: Dívidas/Empréstimo, kind: expense}
  - {name: Transferência interna, kind: expense}
  - {name: Outros, kind: expense}

# Todas AMBOS (D20). Sem conta bancária (account_id nulo): o pagamento pede a conta no uso.
