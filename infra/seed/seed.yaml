  - {name: Reserva mínima, owner: AMBOS, type: accumulate, target_cents: 200000}
  - {name: "Plano de saúde (R$ 580/mês a partir de mai/27)", owner: AMBOS, type: accumulate, target_cents: 58000, period: monthly, due_date: "2027-05-01"}
  - name: Uber diário
    owner: MATHEUS
    type: income_period
    period: daily
    category: Uber/99
    target_cents: 13000
    levels:
      - {name: Piso, target_cents: 10000}
      - {name: Meta, target_cents: 13000}
      - {name: Desafio, target_cents: 16000}
