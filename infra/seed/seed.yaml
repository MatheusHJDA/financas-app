debts:
  # D14: saldo devedor é informado no primeiro uso; até lá usa-se o principal (sem amortização feita).
  # start_date é PLACEHOLDER (início da carga) até o Matheus informar a data do contrato.
  - {name: Empréstimo, owner: AMBOS, principal_cents: 2200000, monthly_rate: "0.034500", installments: 24, installment_cents: 136282, start_date: "2026-11-01", current_balance_cents: 2200000}
  # Parcelas sem juros, valores estimados. Quantidade de parcelas desconhecida: 1 parcela = total.
  - {name: Cartão Santander (Reginaldo), owner: AMBOS, principal_cents: 490000, monthly_rate: "0", installments: 1, installment_cents: 490000, start_date: "2026-11-01", current_balance_cents: 490000}
