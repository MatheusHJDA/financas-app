[project]
name = "finance-api"
version = "0.1.0"
description = "API do app Finanças"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "argon2-cffi",
    "apscheduler>=3.10,<4",
    "pywebpush",
    "openai",
    "pypdf",
    "pillow",
    "pillow-heif",
    "python-multipart",
    "tzdata>=2026.6",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "openapi-spec-validator",
    "pyyaml",
    "pytest-playwright>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not e2e'"
markers = [
    "live: usa a API real da OpenAI (gasta crédito); desligado por padrão",
    "e2e: navegador real (Playwright) contra o app; roda só em `tasks.ps1 e2e`",
]
